<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0B0D" />
  <title>Offline — RAIN Monetize</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0b0b0d;
      background-image: radial-gradient(700px 400px at 50% -10%, rgba(226, 0, 116, 0.12), transparent 60%);
      color: #f4f2f5;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      border: 1px solid #27272f;
      background: #17171d;
      border-radius: 16px;
      padding: 40px 32px;
    }
    img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 20px; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; font-weight: 800; }
    p { margin: 0 0 24px; color: #8f8a99; font-size: 0.95rem; line-height: 1.5; }
    a {
      display: inline-block;
      border-radius: 12px;
      background: linear-gradient(100deg, #e20074 0%, #ff4d9e 100%);
      padding: 0.7rem 1.4rem;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(226, 0, 116, 0.28);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="RAIN Monetize" />
    <h1>You&rsquo;re offline</h1>
    <p>RAIN Monetize needs a connection to work its magic. Check your network and try again.</p>
    <a href="/dashboard">Retry</a>
  </div>
</body>
</html>
