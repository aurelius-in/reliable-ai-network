<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Gallery | Reliable AI Network, Inc.</title>
  <meta name="description" content="Agentic AI Project Gallery: healthcare, AIOps, claims, wellness, recruiting, governance, document AI, AdOps, music, perception lab, edge QA.">
  <link rel="canonical" href="https://reliableainetwork.com/portfolio.html">
  <meta property="og:title" content="Project Gallery | Reliable AI Network">
  <meta property="og:description" content="Filterable gallery of production-minded AI systems with screenshots, demos, and repositories.">
  <meta property="og:url" content="https://reliableainetwork.com/portfolio.html">
  <meta property="og:image" content="https://reliableainetwork.com/assets/brand/rain-banner.jpg">
  <link rel="icon" href="./assets/brand/rain-mark-sm.png" type="image/png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./css/site.css">
  <script src="./js/site.js" defer></script>
  <script src="./js/projects-api.js" defer></script>
  <script src="./js/gallery.js" defer></script>
  <style>
    .portfolio .filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:8px 0 16px}
    .portfolio .filters label{font-weight:700}
    .portfolio .grid{grid-template-columns: repeat(auto-fill,minmax(280px,1fr))}
    .portfolio .card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;flex-wrap:wrap}
    .portfolio .card .repo{display:inline-block;padding:10px 12px;border-radius:12px;border:1px solid rgba(148,163,184,.25)}
    .badge{display:inline-block;font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid rgba(148,163,184,.25);background:rgba(148,163,184,.12);margin-right:6px;margin-top:6px}
    .pill{display:inline-block;padding:8px 12px;border-radius:999px;background:rgba(15,23,42,.6);border:1px solid rgba(148,163,184,.2);font-weight:700}
    .small{font-size:12px;color:#94a3b8}
    .card .title{margin-bottom:4px}
    .muted{color:#94a3b8}

    .proj-card .proj-media{
      border-radius:10px; overflow:hidden; margin:-2px -2px 8px;
      background:#0b1220; border:1px solid rgba(148,163,184,.15)
    }
    .proj-card .thumb{
      display:block; width:100%; aspect-ratio:16/9; object-fit:cover;
    }
  </style>
</head>
<body class="rain-body" data-page="portfolio">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main" class="container section portfolio">
    <h1 style="margin:0 0 8px">Project Gallery</h1>
    <p class="lead">Filter by industry, capability, or code access. Every project includes agentic orchestration, traces, and a usable UI.</p>
    <p class="small" style="margin:6px 0 12px; color:#9fb3ca">
      All software in this portfolio was designed and built by <strong>Oliver Ellison</strong> d/b/a <strong>Reliable AI Network, Inc.</strong> ("RAIN").
    </p>

    <div class="filters">
      <div>
        <label for="fIndustry">Industry</label>
        <select id="fIndustry" class="input">
          <option value="all">All industries</option>
        </select>
      </div>
      <div>
        <label for="fCap">Capability</label>
        <select id="fCap" class="input">
          <option value="all">All capabilities</option>
        </select>
      </div>
      <div>
        <label for="fCode">Code access</label>
        <select id="fCode" class="input">
          <option value="all">All</option>
          <option value="open_source">Open Source</option>
          <option value="proprietary_saas">Proprietary SaaS</option>
        </select>
      </div>
    </div>

    <div id="grid" class="grid"></div>
  </main>

  <div id="site-footer"></div>
</body>
</html>
